[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desi-workbench-backend"
version = "0.3.0a0"
description = "DESi Workbench backend and seven-role MCP epistemic-review server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanns-Steffen Rentschler" }]
keywords = ["desi", "epistemic audit", "paper review", "mcp", "chatgpt app", "fastapi"]

# The workbench uses the REAL DESi governance library as an installable
# dependency. It never re-implements the replay kernel, governance core,
# concept gates, determinism scanner, or artifact format.
dependencies = [
    "desi-governance>=0.1.0a0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6,<3.0",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
files = ["pymupdf>=1.26"]
# Optional for local fallback operation, mandatory in the published container
# and the ecosystem CI job. Commit pins make provenance reproducible.
ecosystem = [
    "kevin @ git+https://github.com/hstre/Kevin@feecc15b210f98c478f006c794091f4f3b01a9d0",
    "doktores @ git+https://github.com/hstre/Doktores@006d37eb24d0e243f9b22decc6bf8c9e28402c91",
]

[project.scripts]
desi-workbench-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
