name: MCP CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/mcp-ci.yml"
      - "Dockerfile"
      - ".dockerignore"
  push:
    branches:
      - "mcp/epistemic-review-v0"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and pinned DESi core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "desi-governance @ git+https://github.com/hstre/DESi@f0984f440a60293a51f002d388cd030be27acf1e"
          python -m pip install -e "./backend[files,test]"

      - name: Compile modules
        run: python -m compileall -q backend/app

      - name: Run tests
        env:
          DESI_MCP_DB: ${{ runner.temp }}/epistemic-review.sqlite3
        run: python -m pytest -q backend/tests

      - name: Import MCP server
        working-directory: backend
        run: |
          python - <<'PY'
          from app.mcp_server import mcp
          assert mcp is not None
          print("MCP server import OK")
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: desi-epistemic-review:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
