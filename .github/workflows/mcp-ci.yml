name: MCP CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/mcp-ci.yml"
      - "Dockerfile"
      - ".dockerignore"
  push:
    branches:
      - "mcp/epistemic-review-v0"

permissions:
  contents: read

jobs:
  test-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and pinned DESi core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "desi-governance @ git+https://github.com/hstre/DESi@f0984f440a60293a51f002d388cd030be27acf1e"
          python -m pip install -e "./backend[files,test]"

      - name: Compile modules
        run: python -m compileall -q backend/app

      - name: Run fallback-capable tests
        env:
          DESI_MCP_DB: ${{ runner.temp }}/epistemic-review.sqlite3
        run: python -m pytest -q backend/tests

  test-native-ecosystem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install DESi, Kevin, Doktores and Workbench
        run: |
          python -m pip install --upgrade pip
          python -m pip install "desi-governance @ git+https://github.com/hstre/DESi@f0984f440a60293a51f002d388cd030be27acf1e"
          python -m pip install -e "./backend[files,test,ecosystem]"

      - name: Run strict ecosystem suite
        env:
          DESI_REQUIRE_ECOSYSTEM: "1"
          DESI_MCP_DB: ${{ runner.temp }}/epistemic-review.sqlite3
        run: python -m pytest -q backend/tests

  transport-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Check browser JavaScript syntax
        run: node --check backend/app/static/app.js

      - name: Install native ecosystem
        run: |
          python -m pip install --upgrade pip
          python -m pip install "desi-governance @ git+https://github.com/hstre/DESi@f0984f440a60293a51f002d388cd030be27acf1e"
          python -m pip install -e "./backend[files,ecosystem]"

      - name: Start server and verify cockpit plus MCP client
        working-directory: backend
        env:
          DESI_REQUIRE_ECOSYSTEM: "1"
          DESI_MCP_HOST: 127.0.0.1
          DESI_MCP_PORT: "8000"
          DESI_MCP_DB: ${{ runner.temp }}/transport.sqlite3
        run: |
          set -euo pipefail
          python -m app.mcp_server >mcp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat mcp-server.log' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/", timeout=2) as response:
                      page = response.read().decode("utf-8")
                  if "Epistemic Review Cockpit" in page:
                      break
              except Exception:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit("cockpit did not become ready")

          with urllib.request.urlopen("http://127.0.0.1:8000/ui/api/capabilities") as response:
              capabilities = json.load(response)
          assert capabilities["interfaces"]["browser_cockpit"] == "/"
          assert capabilities["interfaces"]["mcp"] == "/mcp"
          print("COCKPIT_HTTP_OK")
          PY
          python scripts/mcp_smoke.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container with native ecosystem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: desi-epistemic-review:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
