# Optional local stack: backend (FastAPI) + frontend (Next.js).
# Neo4j is not required for the MVP.
#
#   docker compose up --build
#   open http://localhost:3000
#
# The backend image installs the real (public) desi-governance library
# from git during the build.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DESI_WORKBENCH_OFFLINE_MODE: "true"
      DESI_WORKBENCH_ALLOW_LIVE_LLM_CALLS: "false"
      DESI_WORKBENCH_DATA_DIR: /data/reviews
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
